<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width", initial-scale="1.0">
        <title> Haven Dashboard </title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <section class="first-page">
            <img
            src="graphic 02.png"
            alt="Just breathe"
            class="breathe-graphic"
            >
            <img
            src="sep cal.png"
            alt=""
            class="calendar-graphic"
            >
        </section>

        <section class="dashboard-section">
            <img
            src="folder graphic.png"
            alt="Haven dashboard"
            class="haven-graphic"
            >

        </section>

        <section class="final-section">
            <img
            src="To_Do_real-removebg-preview.png"
            alt="To-do list"
            class="todo-graphic"
            >

            <div class="timer-area">
                <img
                src="timer_bg-removebg-preview.png"
                alt=""
                class="timer-background"
                >

                <div id="timer-display" class="timer-display">
                    00:00
                </div>

                <button
                id="start-timer"
                class="timer-button start-button"
                type="button"
                aria-label="Start timer"
                >

                <img src="green can.png" alt="Start timer">
                </button>

                <button
                id="stop-timer"
                class="timer-button stop-button"
                type="button"
                aria-label="Stop timer">
                <img src="red can.png" alt="Stop timer">
                </button>
            </div>
        </section>
        <script src="timer.js" defer>
        </script>
        

    </body>
</html>
