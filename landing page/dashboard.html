<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width", initial-scale="1.0">
        <title> Haven Dashboard </title>
        <link rel="stylesheet" href="styled.css">
    </head>
    <body>
        <section class="first-page">
            <img
            src="graphic 02.png"
            alt="Just breathe"
            class="breathe-graphic"
            >
            <img
            src="sep cal.png"
            alt=""
            class="calendar-graphic"
            >
        </section>

        <section class="dashboard-section">
            <img
            src="folder graphic.png"
            alt="Haven dashboard"
            class="haven-graphic"
            >

        </section>

        <section class="final-dashboard">
            <img 
            src="images/todo.png"
            alt="To-do list"
            class="todo-graphic"
            >

            <div class="timer-stage">
                <img
                src="images/timer-background.png"
                alt="Stopwatch"
                class="timer-background"
                >

                <button class="timer-can start-timer">
                    <img
                    src="images/green-can.png"
                    alt="Start timer"
                    >
                </button>

                <button class="timer-can stop-timer">
                    <img
                    src="images/red-can.png"
                    alt="Stop timer"
                    >
                </button>
            </div>
        </section>
        <script src="" defer>
        </script>

    </body>
</html>
